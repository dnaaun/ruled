name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - run: npm ci
      - run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Ruled-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' }
      - name: Install NDK
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" > /dev/null
      - run: npm ci
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash scripts/sign-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Ruled-Android
          path: release/*.apk

  release:
    needs: [macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with: { path: artifacts, merge-multiple: true }
      - name: Name files
        run: |
          cd artifacts
          for f in *.dmg; do mv "$f" "Ruled-macOS-universal.dmg"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruled 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **macOS:** download `Ruled-macOS-universal.dmg`, drag Ruled to Applications. The app is unsigned: the first time, right-click → Open (or run `xattr -cr /Applications/Ruled.app`).
            **Android:** download `Ruled.apk` and open it (allow installing unknown apps).
          files: |
            artifacts/Ruled-macOS-universal.dmg
            artifacts/Ruled.apk
